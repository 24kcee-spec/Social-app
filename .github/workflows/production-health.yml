name: production health
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths: ['scripts/check-deployment.py', '.github/workflows/production-health.yml']
permissions:
  contents: read
concurrency:
  group: production-health
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 scripts/check-deployment.py
