name: verify
on:
  push:
    branches: [main, phase6-community]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sp/mobile run config:check
      - run: pnpm --filter @sp/mobile exec expo config --type public
      - run: pnpm verify
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: pnpm --filter @sp/web exec playwright install --with-deps chromium
      - run: pnpm --filter @sp/web test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
