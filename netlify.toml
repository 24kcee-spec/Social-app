# Optional commercial-compatible free host. This does not move the live site.
# Select the Free plan and set the package directory to apps/web in Netlify.
# Netlify detects Next.js and supplies its maintained OpenNext adapter.
[build]
  command = "pnpm --filter @sp/web build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "9.15.4"
  PUBLIC_API_URL = "https://social-app-bh1h.onrender.com"
  PUBLIC_WEB_URL = "https://sidlezw.netlify.app"
  COMMERCIAL_DEPLOYMENT_APPROVED = "false"
  ENABLE_PAYMENTS = "false"
  ADSENSE_VERIFICATION_ENABLED = "false"
  CALL_ICE_MODE = "disabled"
  LIVEKIT_GUARD_ENABLED = "false"
  # These settings are public configuration, including the browser publishable key.
  # Keep secret scanning enabled for all other variables and credentials.
  SECRETS_SCAN_OMIT_KEYS = "APP_ENV,PORT,SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY"
